<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eterna Primavera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f4ef;
      --cream-dark: #f0ebe3;
      --line: #d4ccc3;
      --muted: #C7CDBF;
      --taupe: #AF9F90;
      --text: #3a3530;
      --text-soft: #7a6e66;
    }

    html, body { height: 100%; }

    body {
      background: var(--cream);
      font-family: 'Jost', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(199,205,191,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 90% 80%, rgba(175,159,144,0.12) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '✿';
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      font-size: 60px;
      color: rgba(199,205,191,0.25);
      pointer-events: none;
      z-index: 0;
      transform: rotate(15deg);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 3rem 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-wrap {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeUp 0.8s ease both;
    }

    .logo-wrap img {
      max-width: 260px;
      height: auto;
      max-height: 110px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* Tagline */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-style: italic;
      color: var(--text-soft);
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.6;
      max-width: 340px;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.8s 0.1s ease both;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 2rem;
      animation: fadeUp 0.8s 0.2s ease both;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: var(--line);
    }
    .divider-icon { font-size: 12px; color: var(--muted); }

    /* Buttons */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 1.1rem 1.5rem;
      text-decoration: none;
      border: 0.5px solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.8s ease both;
    }

    .link-btn:nth-child(1) { animation-delay: 0.3s; }
    .link-btn:nth-child(2) { animation-delay: 0.45s; }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--cream-dark);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 0;
    }

    .link-btn:hover::before { transform: translateX(0); }
    .link-btn:hover { border-color: var(--taupe); transform: translateY(-1px); }

    .link-btn .btn-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .link-btn .btn-icon { font-size: 18px; flex-shrink: 0; }

    .link-btn .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .link-btn .btn-label { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); }
    .link-btn .btn-sub { font-size: 11px; letter-spacing: 0.06em; text-transform: none; color: var(--taupe); font-weight: 300; }

    .link-btn .btn-arrow {
      position: relative;
      z-index: 1;
      font-size: 14px;
      color: var(--muted);
      transition: transform 0.2s, color 0.2s;
    }
    .link-btn:hover .btn-arrow { transform: translateX(3px); color: var(--taupe); }

    .link-btn.whatsapp:hover { border-color: #8a9e8a; }
    .link-btn.whatsapp .btn-icon { color: #8a9e8a; }
    .link-btn.catalog .btn-icon { color: var(--taupe); }

    /* Bottom ornament */
    .bottom-ornament {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      animation: fadeUp 0.8s 0.7s ease both;
    }

    .bottom-rule {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 140px;
    }
    .bottom-rule::before, .bottom-rule::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: var(--line);
    }
    .bottom-rule-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }

    .bottom-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      font-style: italic;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .bottom-location {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c8bdb6;
      font-weight: 300;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .container { padding: 2.5rem 1.25rem 3rem; }
    }
  </style>
</head>
